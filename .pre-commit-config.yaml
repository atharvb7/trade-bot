repos:
  - repo: local
    hooks:
      - {id: ruff, name: ruff, entry: .venv/bin/ruff check, language: system, types: [python]}
      - {id: mypy, name: mypy, entry: .venv/bin/mypy src, language: system, pass_filenames: false}
      - {id: pytest, name: pytest, entry: .venv/bin/pytest -q, language: system, pass_filenames: false}
