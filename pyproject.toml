[project]
name = "trading-bot"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"dashboard/**" = ["E501", "I001"]
